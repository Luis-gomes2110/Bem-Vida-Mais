<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | BemVida+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho-publico">
    <span class="logo">BemVida+</span>
    <nav class="nav-publica">
      <a href="index.html">Início</a>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="campanhas.html">Campanhas</a>
    </nav>
    <div class="acoes-cabecalho">
      <a href="login.html" class="botao botao-secundario">Login</a>
      <a href="cadastro.html" class="botao botao-escuro">Cadastro</a>
    </div>
  </header>

  <section class="pagina-auth">
    <div class="cartao-auth" style="max-width: 460px;">

      <div class="icone-auth">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21s-7.5-4.6-10-9.2C0.3 8.1 2 4.5 5.6 4.1c2-0.2 3.7 0.8 4.9 2.4 1.2-1.6 2.9-2.6 4.9-2.4 3.6 0.4 5.3 4 3.6 7.7C19.5 16.4 12 21 12 21z" fill="white"/>
        </svg>
      </div>

      <h1>Criar conta</h1>
      <p class="subtitulo-auth">Preencha os dados abaixo.</p>

      <!-- Protótipo estático: leva direto para a Área Doador,
           simulando um cadastro concluído. -->
      <form action="doador/area.html">
        <div class="campo-formulario">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="[ nome completo ]">
        </div>

        <div class="campo-formulario">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="[ CPF ]">
        </div>

        <div class="campo-formulario">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="[ e-mail ]">
        </div>

        <div class="campo-formulario">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="[ telefone ]">
        </div>

        <div class="campo-formulario">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="[ senha ]">
        </div>

        <div class="campo-formulario">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" placeholder="[ confirmar senha ]">
        </div>

        <button type="submit" class="botao botao-primario botao-bloco">Criar conta</button>
      </form>

      <p class="rodape-auth">Já possui conta? <a href="login.html">Faça login</a></p>
    </div>
  </section>

  <footer class="rodape">
    [ links institucionais · contato · termos ]
  </footer>

</body>
</html>
